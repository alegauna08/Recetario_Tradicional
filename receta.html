<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receta</title>
</head>
<style>
    main {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }
    .volver {
        display: inline-block;
        margin-top: 20px;
        padding: 8px 12px;
        border-radius: 4px;
        background: #007bff;
        color: #fff;
        text-decoration: none;
    }
</style>
<body>
    <main>
        <h1 id="nombre">Receta</h1>
        <img id="imagen" alt="" hidden style="max-width: 100%; max-height: 400px;">
        <p id="resumen"></p>
        <h2>Ingredientes</h2>
        <ul id="ingredientes"></ul>
        <h2>Paso a paso</h2>
        <ol id="pasos"></ol>
        <a class="volver" href="index.html">Volver al recetario</a>
    </main>
    <script src="recetas.js"></script>
    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        const receta = recetas.find(item => item.id === id);

        if (receta) {
            document.title = receta.nombre;
            document.querySelector('#nombre').textContent = receta.nombre;
            document.querySelector('#resumen').textContent = receta.resumen;

            if (receta.imagen) {
                const imagen = document.querySelector('#imagen');
                imagen.src = receta.imagen;
                imagen.alt = receta.nombre;
                imagen.hidden = false;
            }

            receta.ingredientes.forEach(ingrediente => {
                const elemento = document.createElement('li');
                elemento.textContent = ingrediente;
                document.querySelector('#ingredientes').append(elemento);
            });

            receta.pasos.forEach(paso => {
                const elemento = document.createElement('li');
                elemento.textContent = paso;
                document.querySelector('#pasos').append(elemento);
            });
        } else {
            document.querySelector('#nombre').textContent = 'Receta no encontrada';
            document.querySelector('#resumen').textContent =
                'Elegí una receta desde el recetario.';
            document.querySelector('#ingredientes').previousElementSibling.hidden = true;
            document.querySelector('#ingredientes').hidden = true;
            document.querySelector('#pasos').previousElementSibling.hidden = true;
            document.querySelector('#pasos').hidden = true;
        }
    </script>
</body>
</html>
